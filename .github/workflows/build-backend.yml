name: Build & Push Backend Image

on:
  push:
    branches:
      - serverless-backend
    paths:
      - 'apps/backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile.serverless
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cbse-backend:latest
            ghcr.io/${{ github.repository_owner }}/cbse-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
